# remap prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# set window and pane index to 1
set -g base-index 1
set -g pane-base-index 1
set-option -g renumber-windows on

# use zsh as the default shell
# set explicitly: tmux only derives this from $SHELL at server start, and falls
# back to /bin/sh otherwise
set -g default-shell /bin/zsh

# enable 24-bit color so starship's palette is not quantized to 256 colors
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# do not delay when pressing escape
set -s escape-time 0

# without this, the mouse wheel scrolls command history
# with this, it scrolls the pane's output
set -g mouse on

# configure the status bar
set -g status-position top

# Catppuccin Mocha status bar
# hand-rolled rather than via catppuccin/tmux: the pinned checkout predates the
# plugin's v2 rewrite and applies nothing on tmux 3.7
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left "#[fg=#89b4fa,bold] #S "
set -g status-right "#[fg=#a6adc8]%H:%M "
set -g window-status-current-style "fg=#1e1e2e,bg=#cba6f7,bold"
set -g window-status-style "fg=#a6adc8"
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#cba6f7"
set -g message-style "bg=#313244,fg=#cdd6f4"

# remove full stop and dash from default separators
set -g word-separators "!\"#$%&'()*+,/:;<=>?@[\\]^`{|}~"

# install plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# initialize plugin manager
run '~/.tmux/plugins/tpm/tpm'

# reload the configuration file
bind r source-file ~/.tmux.conf \; display-message 'configuration reloaded'

# Pane management

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# unbind arrow keys
unbind Up
unbind Down
unbind Left
unbind Right

# horizontal split (pane above and below)
bind '-' split-window -v
unbind '"'

# vertical split (pane side-by-side)
bind '|' split-window -h
unbind %

# Vi mode

setw -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection
bind-key -T copy-mode-vi Escape send -X cancel
