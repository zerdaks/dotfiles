# Prompt configuration. Requires a Nerd Font (see `just fonts`).

add_newline = true
palette = "catppuccin_mocha"

format = """
$os\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_status\
$golang\
$nodejs\
$java\
$rust\
$ruby\
$lua\
$python\
$aws\
$kubernetes\
$line_break\
$character"""

right_format = """$cmd_duration$jobs$time"""

[os]
disabled = false
style = "text"

[os.symbols]
Macos = " "

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
vicmd_symbol = "[❮](mauve)"

[directory]
style = "blue bold"
truncation_length = 0
truncate_to_repo = false

[git_branch]
symbol = " "
style = "mauve"

# only renders on a detached HEAD, so it doubles as the "you are not on a
# branch" warning; tag_disabled = false names the tag when one points here
[git_commit]
style = "maroon"
tag_disabled = false
tag_symbol = "  "

# mid-rebase / merge / bisect, with the n/m progress starship tracks for us
[git_state]
style = "peach"

# one color per class of change, the way tide splits its git segment, instead
# of a single red blob. ${count} is per-state, so the numbers are the point:
#   =2 conflicted  +3 staged  »1 renamed  !4 modified  ✘1 deleted  ?2 untracked
#   $1 stashed     ⇡2 ahead  ⇣1 behind  ⇡2⇣1 diverged
# markers are starship's defaults; only diverged deviates, trading the bare ⇕
# for the counts, since counts are the whole point of this segment.
# the enclosing style only paints the brackets; each item carries its own.
[git_status]
style = "overlay1"
format = "([\\[$conflicted$staged$renamed$modified$deleted$untracked$stashed$ahead_behind\\]]($style) )"
conflicted = "[=${count}](red)"
staged = "[+${count}](green)"
renamed = "[»${count}](green)"
modified = "[!${count}](yellow)"
deleted = "[✘${count}](maroon)"
untracked = "[?${count}](blue)"
stashed = "[\\$${count}](teal)"
ahead = "[⇡${count}](sky)"
behind = "[⇣${count}](sky)"
diverged = "[⇡${ahead_count}⇣${behind_count}](mauve)"

# starship's defaults are already mascots (go a gopher, rust a crab, python a
# snake, java coffee, lua a moon); only these two needed rescuing
[ruby]
symbol = ""

[nodejs]
symbol = ""

[aws]
style = "peach"

[kubernetes]
disabled = false
style = "sky"

# matches the tide_cmd_duration_threshold this replaces
[cmd_duration]
min_time = 3000
format = "[took $duration]($style) "
style = "yellow"

[jobs]
style = "peach"

[time]
disabled = false
format = "[$time]($style)"
style = "overlay1"
time_format = "%R"

# Catppuccin Mocha, matching .wezterm.lua, .config/bat/config and the tmux theme
[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
